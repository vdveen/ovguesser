name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ovg
          POSTGRES_PASSWORD: ovg
          POSTGRES_DB: ovg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ovg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ovg:ovg@localhost:5432/ovg_test
      E2E_DATABASE_URL: postgres://ovg:ovg@localhost:5432/ovg_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Create e2e database
        run: PGPASSWORD=ovg psql -h localhost -U ovg -d ovg_test -c "create database ovg_e2e"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
