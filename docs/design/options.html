<style>
/* ============================================================
   Page shell: toolbar, stage, notes. Not part of any option.
   ============================================================ */
:root {
  --sans: "Helvetica Neue", Helvetica, "Nimbus Sans", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--sans);
  color: #111;
  background: #e4e4e1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }

.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  background: #fff;
  border-bottom: 1px solid #000;
  font-size: 13px;
  flex: none;
}
.bar .title {
  display: flex;
  align-items: center;
  padding: 0 18px;
  font-weight: 700;
  font-size: 14px;
  border-right: 1px solid #000;
  min-height: 44px;
}
.bar .group { display: flex; align-items: stretch; border-right: 1px solid #000; }
.bar .group > span {
  display: flex;
  align-items: center;
  padding: 0 10px 0 14px;
  color: #777;
}
.bar .group button {
  border: 0;
  background: none;
  padding: 0 11px;
  min-height: 44px;
  color: #333;
}
.bar .group button:hover { background: #eee; }
.bar .group button[aria-pressed="true"] { background: #000; color: #fff; }
.bar .opt b { font-weight: 700; margin-right: 5px; }
.bar .spacer { flex: 1; }

main { flex: 1; display: flex; min-height: 0; }
#stage { position: relative; flex: 1; overflow: hidden; }
.slot { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.slot.phone { padding: 11px; background: #111; border-radius: 58px; }
.slot.phone .frame { border-radius: 47px; }
.slot.desktop .frame { outline: 1px solid #000; }
.slot .caption {
  position: absolute;
  left: 0;
  top: -34px;
  font-size: 22px;
  font-weight: 700;
  white-space: nowrap;
}
.slot.phone .caption { top: -40px; left: 12px; font-size: 26px; }

.notes {
  width: 380px;
  flex: none;
  overflow: auto;
  background: #fff;
  border-left: 1px solid #000;
  font-size: 14px;
  line-height: 1.45;
}
.notes.hidden { display: none; }
.notes section { padding: 22px 24px; border-bottom: 1px solid #000; }
.notes .kicker { font-size: 13px; color: #666; margin: 0 0 2px; }
.notes h2 { font-size: 30px; line-height: 1.05; margin: 0 0 12px; letter-spacing: -0.01em; }
.notes h3 { font-size: 13px; margin: 18px 0 6px; }
.notes .lead { font-size: 16px; margin: 0; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 0 0 6px; }
.notes .icon { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.notes .icon svg { width: 64px; height: 64px; }
.notes .icon p { margin: 0; font-size: 13px; color: #555; }
.notes table { width: 100%; border-collapse: collapse; font-size: 13px; }
.notes th { text-align: left; font-weight: 400; color: #666; padding: 0 8px 6px 0; border-bottom: 1px solid #000; }
.notes td { vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid #ddd; }
.notes td:first-child { color: #777; width: 34%; }
.notes td small { display: block; color: #666; margin-top: 3px; font-size: 12px; }
.notes kbd {
  font: 12px var(--sans);
  border: 1px solid #000;
  padding: 0 5px;
}

/* ============================================================
   Frame: one simulated screen. Everything below is scoped to it.
   ============================================================ */
.frame {
  position: relative;
  overflow: hidden;
  background: #efefec;
  font-family: var(--sans);
  color: #000;
  font-size: 15px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  --st: 0px;
  --sb: 0px;
}
.frame.is-phone { --st: 47px; --sb: 22px; }
.frame .map { position: absolute; inset: 0; }
.frame .ui { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.frame .ui > * { pointer-events: auto; }
.frame .ui .passthrough { pointer-events: none; }
.frame .ui .passthrough > * { pointer-events: auto; }
.frame h1, .frame h2, .frame h3, .frame p, .frame ol, .frame ul { margin: 0; }
.frame ol, .frame ul { padding: 0; list-style: none; }
.frame button { font: inherit; border: 0; background: none; padding: 0; color: inherit; }
.frame table { border-collapse: collapse; width: 100%; }
.frame td, .frame th { padding: 0; text-align: left; font-weight: 400; }
.frame .num, .frame td, .frame b { font-variant-numeric: tabular-nums; }
.frame .r { text-align: right; }
.frame kbd {
  font: 12px var(--sans);
  font-weight: 400;
  border: 1px solid currentColor;
  padding: 1px 5px;
  opacity: 0.7;
}
.frame .veil { position: absolute; inset: 0; pointer-events: none; }

/* Status bar on the phone. */
.sb {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 47px;
  z-index: 40;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 34px 0 42px;
  font-size: 16px;
  font-weight: 600;
}
.sb.light { color: #fff; }
.sb.dark { color: #000; }
.sb::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 11px;
  width: 124px;
  height: 35px;
  margin-left: -62px;
  background: #000;
  border-radius: 18px;
}
.sb .sig { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.sb .batt { width: 26px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.sb .batt::after { content: ""; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: currentColor; border-radius: 1px; }

/* MapLibre controls: square, and moved out of the way of each layout via --in-* insets. */
.frame .maplibregl-ctrl-group { border-radius: 0 !important; box-shadow: none !important; border: 1px solid #000; }
.frame .maplibregl-ctrl-group button { border-radius: 0 !important; width: 32px; height: 32px; }
.frame .maplibregl-ctrl-group button + button { border-top: 1px solid #000; }
.frame .maplibregl-ctrl-top-right { top: var(--in-t, 0); right: var(--in-r, 0); }
.frame .maplibregl-ctrl-bottom-right { bottom: var(--in-b, 0); right: var(--in-r, 0); }
.frame .maplibregl-ctrl-bottom-left { bottom: var(--in-b, 0); left: var(--in-l, 0); }
.frame .maplibregl-ctrl-scale { border-radius: 0; border-color: #000; background: rgba(255, 255, 255, 0.8); font-size: 11px; }
.frame .maplibregl-ctrl-attrib.maplibregl-compact { border-radius: 0; }
.frame.is-phone .maplibregl-ctrl-top-right { display: none; }

/* Map markers. Every marker is a 0x0 box on its point; parts are positioned around it. */
.mk { position: relative; width: 0; height: 0; }
.mk > i {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  font-style: normal;
}
.mk > span { position: absolute; white-space: nowrap; font-variant-numeric: tabular-nums; }

.mk-station > span { bottom: 26px !important; top: auto !important; left: -7px !important; transform: none !important; }
.mk-station > span::after { content: ""; position: absolute; top: 100%; left: 6px; width: 2px; height: 19px; background: inherit; }
.mk-station.left > span { left: auto !important; right: -7px !important; }
.mk-station.left > span::after { left: auto; right: 6px; }
.mk-stop.left > span { left: auto !important; right: 15px !important; transform: none !important; }

/* Shared bits used by several options. */
.histo { position: relative; margin: 0; padding-top: 18px; }
.histo .bars { display: flex; align-items: flex-end; gap: 3px; height: 64px; position: relative; }
.histo .bars i { flex: 1; position: relative; font-style: normal; }
.histo .bars em {
  position: absolute;
  bottom: calc(100% + 3px);
  left: 50%;
  transform: translateX(-50%);
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
}
.histo .avg { position: absolute; top: -6px; bottom: 0; width: 0; border-left: 1px dashed; }
.histo .axis { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; }
.bar-cell i { display: block; height: 6px; }

/* ============================================================
   A \b7  Perron. Blue sign band on top, black strip below it.
   ============================================================ */
.opt-a { --blue: #0b2e6f; }
.opt-a .top { position: absolute; top: 0; left: 0; right: 0; }
.opt-a .band { background: var(--blue); color: #fff; }
.opt-a .strip { background: #000; color: #fff; }
.opt-a .soft { color: #9a9a9a; }
.opt-a .band .soft { color: rgba(255, 255, 255, 0.72); }
.opt-a .link { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.opt-a .grid3 { display: grid; grid-template-columns: 232px 1fr 232px; column-gap: 32px; padding: 0 32px; }
.is-desktop.opt-a .band { padding-top: 24px; padding-bottom: 26px; }
.opt-a .brand b { display: block; font-size: 16px; }
.opt-a .brand span { font-size: 14px; }
.opt-a .q-lbl { display: block; font-size: 17px; margin-bottom: 2px; }
.opt-a .band h1 { font-size: 50px; line-height: 1.02; letter-spacing: -0.018em; font-weight: 700; }
.opt-a .prog { text-align: right; font-size: 14px; }
.opt-a .sq { display: flex; gap: 4px; justify-content: flex-end; margin-top: 8px; }
.opt-a .sq i { width: 16px; height: 16px; border: 1px solid rgba(255, 255, 255, 0.55); }
.opt-a .sq i.done { background: #fff; border-color: #fff; }
.opt-a .sq i.now { border: 3px solid #fff; }
.is-desktop.opt-a .strip { height: 48px; align-items: center; font-size: 15px; }
.opt-a .strip .links { display: flex; gap: 22px; }
.opt-a .strip .nums { display: flex; gap: 18px; justify-content: flex-end; white-space: nowrap; }
.opt-a .strip .nums b { font-size: 17px; margin-left: 6px; }
.opt-a .strip .msg b { font-weight: 700; }
.opt-a .delta { color: #fff; margin-left: 10px; font-weight: 700; }
.opt-a .btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  height: 56px;
  padding: 0 18px;
  background: var(--blue);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  text-align: left;
}
.opt-a .btn.black { background: #000; }
.opt-a .btn.line { background: #fff; color: #000; box-shadow: inset 0 0 0 2px #000; }
.opt-a .confirm { position: absolute; display: flex; }
.is-desktop.opt-a .confirm { left: 50%; bottom: 40px; transform: translateX(-50%); }
.opt-a .confirm .btn { width: auto; height: 60px; }
.opt-a .confirm .btn.go { min-width: 240px; font-size: 18px; }
.opt-a .result { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid #000; }
.is-desktop.opt-a .result { padding-top: 24px; padding-bottom: 28px; }
.opt-a .result h2 { font-size: 32px; line-height: 1.1; }
.opt-a .result p { font-size: 16px; margin-top: 6px; }

/* ============================================================
   A \u00b7 Perron
   ============================================================ */
function renderA(screen, device) {
  const d = device === "desktop";
  if (screen === "start" || screen === "history") {
    const drawer = screen === "history" ? historyA(device) : "";
    if (d) {
      return {
        html: `<div class="top" data-inset="top">
            <div class="band grid3">
              <div></div>
              <div><span class="q-lbl soft">${T.intro}</span><h1>${T.brand}</h1></div>
              <div style="text-align:right">${lang()}</div>
            </div>
            <div class="strip grid3">
              <div class="links"><button class="link" data-go="history">${T.myRuns}</button></div>
              <div>148 spelers deden vandaag al mee.</div>
              <div></div>
            </div>
          </div>
          <div class="panel" data-inset="left" style="position:absolute;left:296px;top:190px;width:420px">
            <section class="sec">
              <h2>${T.dailyTitle}</h2>
              <p>${T.dailyMeta}</p>
              <button class="btn" data-go="raden">${T.dailyStart}<span>\u2192</span></button>
            </section>
            <section class="sec">
              <h2>${T.freeTitle}</h2>
              <p>${T.freeMeta}</p>
              ${radios()}
              <button class="btn black" data-go="raden">${T.freeStart}<span>\u2192</span></button>
            </section>
            <section class="sec" style="padding-top:16px;padding-bottom:18px">
              ${rules()}
              <p class="credit" style="margin-top:14px">${T.credit}</p>
            </section>
          </div>${drawer}`,
        status: "light",
      };
    }
    if (screen === "history") return { html: drawer, status: "light" };
    return {
      html: `<div class="top" data-inset="top">
          <div class="band">
            <div class="row1"><span class="soft">${T.intro}</span></div>
            <h1 style="font-size:44px">${T.brand}</h1>
          </div>
          <div class="strip"><button class="link" data-go="history">${T.myRuns}</button>${lang().replace('class="lang"', 'class="lang" style="border-color:#fff"')}</div>
        </div>
        <div class="sheet" data-inset="bottom">
          <section class="sec">
            <h2>${T.dailyTitle}</h2>
            <p>${T.dailyMeta} <span class="credit">${T.dailyPlayers}.</span></p>
            <button class="btn" data-go="raden">${T.dailyStart}<span>\u2192</span></button>
          </section>
          <section class="sec">
            <h2>${T.freeTitle}</h2>
            <p>${T.freeMeta}</p>
            ${radios()}
            <button class="btn black" data-go="raden">${T.freeStart}<span>\u2192</span></button>
          </section>
          <section class="sec" style="padding-top:12px;padding-bottom:10px"><p class="credit">${T.credit}</p></section>
        </div>`,
      status: "light",
    };
  }

  if (screen === "einde") {
    if (d) {
      return {
        html: `<div class="top" data-inset="top">
            <div class="band grid3">
              <div class="brand"><b>${T.brand}</b><span class="soft">${T.dailyTitle}</span></div>
              <div><span class="q-lbl soft">Uitslag, 28 september</span><h1>${nf(TOTAL)} <span class="soft" style="font-size:24px;font-weight:400;letter-spacing:0">${T.outOf}</span></h1></div>
              <div style="text-align:right"><button class="link" data-go="start">${T.home}</button></div>
            </div>
            <div class="strip grid3">
              <div class="links"><button class="link" data-go="start">${T.menu}</button></div>
              <div>${T.rank}</div>
              <div></div>
            </div>
          </div>
          <div class="panel" data-inset="left" style="position:absolute;left:296px;top:212px;width:520px">
            <section class="sec">${endTable()}</section>
            <section class="sec">${histo()}</section>
            <section class="sec" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <button class="btn" data-go="raden">${T.again}<span>\u2192</span></button>
              <button class="btn line">${T.share}</button>
              <p class="credit" style="grid-column:2">${T.shareNote}</p>
            </section>
          </div>`,
        status: "light",
      };
    }
    return {
      html: `<div class="page">
          <div class="band" style="padding-bottom:18px">
            <div class="row1"><span class="soft">Uitslag, 28 september</span><button class="link" data-go="start">${T.close}</button></div>
            <h1 style="font-size:56px;line-height:1">${nf(TOTAL)}</h1>
            <span class="soft">${T.outOf}</span>
          </div>
          <div class="strip">${T.rank}</div>
          <section class="sec" style="padding-bottom:10px">${endTable()}</section>
          <section class="sec" style="border-top:0;padding-top:4px">${histo()}</section>
          <section class="sec" style="display:grid;gap:8px;margin-top:auto;padding-bottom:calc(14px + var(--sb))">
            <button class="btn" data-go="raden" style="height:52px">${T.again}<span>\u2192</span></button>
            <button class="btn line" style="height:52px">${T.share}</button>
            <p class="credit">${T.shareNote}</p>
          </section>
        </div>`,
      status: "light",
    };
  }

  // Play screens.
  const s = play(screen, device);
  const nums = `<span><span class="soft">${s.found ? "Verdiend" : T.left}</span><b>${nf(s.left)}</b></span><span><span class="soft">${T.total}</span><b>${nf(s.total)}</b></span>`;
  const msg = `${s.msg}${s.delta ? `<span class="delta">\u2212${nf(s.delta)} punten</span>` : ""}`;
  const confirm = s.pending
    ? `<div class="confirm" data-inset="bottom"><button class="btn line">${T.remove}</button><button class="btn go" data-go="mis">${T.confirm}${kbd(device)}</button></div>`
    : "";
  if (d) {
    const result = s.found
      ? `<div class="result grid3" data-inset="bottom">
          <div></div>
          <div><h2>${T.foundTitle}</h2><p>${T.stat}</p></div>
          <div><div class="pts">+${nf(s.left)}</div><button class="btn" data-go="einde">${T.next}${kbd(device)}</button></div>
        </div>`
      : "";
    return {
      html: `<div class="top" data-inset="top">
          <div class="band grid3">
            <div class="brand"><b>${T.brand}</b><span class="soft">${T.dailyTitle}</span></div>
            <div><span class="q-lbl soft">${T.whereIs}</span><h1 data-name>${station.name}</h1></div>
            <div class="prog">${progressText(s)}${squares(s)}</div>
          </div>
          <div class="strip grid3">
            <div class="links"><button class="link" data-go="start">${T.menu}</button>${s.found ? "" : `<button class="link">${T.giveUp}</button>`}</div>
            <div class="msg">${s.found ? "" : msg}</div>
            <div class="nums">${nums}</div>
          </div>
        </div>${confirm}${result}`,
      status: "light",
    };
  }
  const result = s.found
    ? `<div class="result" data-inset="bottom">
        <div class="head"><h2>${T.foundTitle}</h2><div class="pts">+${nf(s.left)}</div></div>
        <p>${T.stat}</p>
        <button class="btn" data-go="einde">${T.next}<span>\u2192</span></button>
      </div>`
    : "";
  return {
    html: `<div class="top" data-inset="top">
        <div class="band">
          <div class="row1"><span style="display:flex;align-items:center">${progressText(s)}${squares(s)}</span><button class="link" data-go="start">${T.menu}</button></div>
          <span class="q-lbl soft">${T.whereIs}</span><h1 data-name>${station.name}</h1>
        </div>
        <div class="strip"><span class="nums">${nums}</span>${s.found ? "" : `<button class="link">${T.giveUp}</button>`}</div>
        ${s.found ? "" : `<div class="msgline">${msg.replace('class="delta"', 'class="delta" style="color:#000"')}</div>`}
      </div>${confirm}${result}`,
    status: "light",
  };
}
function historyA(device) {
  const h = HISTORY;
  return `<aside class="${device === "desktop" ? "drawer" : "page"}" data-inset="right">
      <div class="band" style="${device === "phone" ? "padding:calc(var(--st) + 10px) 16px 16px;display:flex;justify-content:space-between;align-items:baseline" : ""}"><h2 style="font-size:34px">${T.myRuns}</h2><button class="link" data-go="start">${T.close}</button></div>
      <div class="body" style="${device === "phone" ? "padding:0 16px" : ""}">
        <div class="stats">${h.stats.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>
        <p class="h3">Lastigste stations</p>
        <table class="tbl"><tbody>${h.hardest.map(([n, c, a]) => `<tr><td>${n}</td><td class="soft">${c} gespeeld</td><td class="r pt">gem. ${a}</td></tr>`).join("")}</tbody></table>
        <p class="h3">Alle ritten</p>
        <table class="tbl"><tbody>${h.runs.map(([w, k, p]) => `<tr><td class="soft">${w}</td><td>${k}</td><td class="r pt">${p}</td></tr>`).join("")}</tbody></table>
        <p class="data">${h.data}</p>
        <div class="data-actions"><button class="link">Exporteer</button><button class="link">Importeer</button><button class="link">Wis alles</button></div>
        <p class="data">${h.privacy}</p>
      </div>
    </aside>`;
}

/* ============================================================
   B \u00b7 Canon
   ============================================================ */
function progB(s) {
  return `<ol class="prog">${ROUNDS.map((r, i) => {
    const st = i < s.done ? "done" : i === s.now ? "now" : "";
    return `<li class="${st}"><span>${i + 1}</span><b>${i < s.done ? nf(r.pts) : i === s.now ? "nu" : "&nbsp;"}</b></li>`;
  }).join("")}</ol>`;
}
function renderB(screen, device) {
  const d = device === "desktop";
  const band = (right) => `<div class="bandb"><b>${T.brand}</b>${right}</div>`;

  if (screen === "start") {
    const body = `
        <p class="title">${T.intro}</p>
        ${rules()}
        <section class="sec">
          <h2>${T.dailyTitle}</h2>
          <p>${T.dailyMeta}<br><span class="soft">${T.dailyPlayers}</span></p>
          <button class="btn" data-go="raden">${T.dailyStart}<span>\u2192</span></button>
        </section>
        <section class="sec">
          <h2>${T.freeTitle}</h2>
          <p>${T.freeMeta}</p>
          ${radios()}
          <button class="btn line" data-go="raden">${T.freeStart}<span>\u2192</span></button>
        </section>
        <div class="foot"><button class="link" style="color:#000" data-go="history">${T.myRuns}</button><span>${T.credit}</span></div>`;
    const langB = `<span><b>NL</b> <button style="color:#8a8a8a;margin-left:8px">EN</button></span>`;
    if (d) return { html: `<aside class="col" data-inset="left">${band(langB)}<div class="body">${body}</div></aside>`, status: "light" };
    return { html: `<div class="page">${band(langB)}<div class="body">${body}</div></div>`, status: "light" };
  }

  if (screen === "history") {
    const h = HISTORY;
    const body = `
        <p class="title" style="font-size:40px">${T.myRuns}</p>
        <div class="stats" style="margin-top:18px">${h.stats.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>
        <p class="h3" style="margin-top:6px">Lastigste stations</p>
        <table class="rtbl"><tbody>${h.hardest.map(([n, c, a]) => `<tr><td>${n}</td><td class="soft">${c}</td><td class="pt">gem. ${a}</td></tr>`).join("")}</tbody></table>
        <p class="h3">Alle ritten</p>
        <table class="rtbl"><tbody>${h.runs.map(([w, k, p]) => `<tr><td class="soft">${w}</td><td>${k}</td><td class="pt">${p}</td></tr>`).join("")}</tbody></table>
        <p class="data">${h.data}</p>
        <div class="data-actions"><button class="link">Exporteer</button><button class="link">Importeer</button><button class="link">Wis alles</button></div>`;
    const back = `<button class="link" data-go="start">\u2190 ${T.home}</button>`;
    if (d) return { html: `<aside class="col" data-inset="left">${band(back)}<div class="body">${body}</div></aside>`, status: "light" };
    return { html: `<div class="page">${band(back)}<div class="body">${body.replace('font-size:40px', 'font-size:34px')}</div></div>`, status: "light" };
  }

  if (screen === "einde") {
    const body = `
        <p class="q-lbl">${T.endLabel}</p>
        <p class="big-total">${nf(TOTAL)}</p>
        <p class="soft" style="font-size:17px;margin-top:4px">${T.outOf} punten</p>
        ${endTable()}
        <p class="h3">${T.rank}</p>
        ${histo()}
        <div class="actions" style="padding-bottom:${d ? 30 : 12}px">
          <button class="btn" data-go="raden">${T.again}<span>\u2192</span></button>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            <button class="btn line small">${T.share}</button>
            <button class="btn line small" data-go="history">${T.myRuns}</button>
          </div>
          <p class="soft" style="font-size:13px;margin-top:8px">${T.shareNote}</p>
        </div>`;
    const close = `<button class="link" data-go="start">${T.close}</button>`;
    if (d) return { html: `<aside class="col" data-inset="left">${band(close)}<div class="body">${body}</div></aside>`, status: "light" };
    return { html: `<div class="page">${band(close)}<div class="body" style="padding-bottom:var(--sb)">${body}</div></div>`, status: "light" };
  }

  const s = play(screen, device);
  const numBlock = `<div class="nums"><div><span>${s.found ? "Verdiend" : T.left}</span><b>${nf(s.left)}</b></div><div><span>${T.total}</span><b>${nf(s.total)}</b></div></div>`;
  const primary = s.found
    ? `<button class="btn" data-go="einde">${T.next}${arrow(device)}</button>`
    : `<button class="btn" ${s.pending ? 'data-go="mis"' : "disabled"}>${T.confirm}${arrow(device)}</button>`;
  if (d) {
    const middle = s.found
      ? `<div class="result"><p class="lbl">${T.foundTitle}</p><p class="pts">+${nf(s.left)}</p><p>${T.stat}</p></div>${guessTable(s)}<p class="msg" style="font-size:15px">${T.total} na deze ronde: <b>${nf(s.total)}</b></p>`
      : `${numBlock}<p class="note">${T.missNote}</p>${s.guesses.length ? guessTable(s) : ""}<p class="msg">${s.msg}</p>`;
    return {
      html: `<aside class="col" data-inset="left">
          ${band(`<button class="link" data-go="start">${T.menu}</button>`)}
          ${progB(s)}
          <div class="body">
            <span class="q-lbl">${T.whereIs}</span>
            <h1 data-name>${station.name.replace("-", "-<wbr>")}</h1>
            ${middle}
            <div class="actions">${primary}<div class="sub">${s.found ? "<span></span>" : `<button class="link">${T.giveUp}</button>`}<span class="soft">${s.found ? "" : "levert 0 punten op"}</span></div></div>
          </div>
        </aside>`,
      status: "light",
    };
  }
  const bottom = s.found
    ? `<div class="result"><p class="lbl">${T.foundTitle}</p><p class="pts">+${nf(s.left)}</p><p>${T.stat}</p></div>${primary}`
    : `<p class="msg">${s.msg}${s.delta ? ` <span class="soft">\u2212${nf(s.delta)}</span>` : ""}</p><div class="row"><button class="link">${T.giveUp}</button>${primary}</div>`;
  return {
    html: `<div class="top" data-inset="top">
        ${band(`<span style="display:flex;gap:18px"><span>${progressText(s)}</span><button class="link" data-go="start">${T.menu}</button></span>`)}
        ${progB(s)}
        <div class="qblock"><span class="q-lbl">${T.whereIs}</span><h1 data-name>${station.name}</h1></div>
        <div class="numsline"><span>${s.found ? "Verdiend" : T.left}<b>${nf(s.left)}</b></span><span>${T.total}<b>${nf(s.total)}</b></span></div>
      </div>
      <div class="bottom" data-inset="bottom">${bottom}</div>`,
    status: "light",
  };
}

/* ============================================================
   C \u00b7 Rit
   ============================================================ */
function renderC(screen, device) {
  const d = device === "desktop";
  const tag = `<div class="tag" data-inset="top"><b>${T.brand}</b><button data-go="start">${T.menu}</button></div>`;

  if (screen === "start") {
    const daily = `<button class="rowbtn primary" data-go="raden"><div><b>${T.dailyTitle}</b><span>${T.dailyMeta}<br>${T.dailyPlayers}.</span></div><p class="arrow">\u2192</p></button>`;
    const free = `<button class="rowbtn" data-go="raden"><div><b>${T.freeTitle}</b><span>Alle 395 stations</span></div><p class="arrow">\u2192</p></button>
      <button class="rowbtn" data-go="raden"><div><b>${T.freeTitle}</b><span>Alleen de 70 intercitystations</span></div><p class="arrow">\u2192</p></button>`;
    if (d) {
      return {
        html: `<section class="dock" data-inset="bottom" style="grid-template-columns:400px 1fr 1fr">

              <h1 style="font-size:52px;margin:0">${T.brand}</h1>
              <p class="msg" style="font-size:18px">${T.intro}</p>
              ${rules()}
            </div>
            <div><p class="colh">Elke dag nieuw</p><div class="rows">${daily}</div>
              <p class="soft" style="font-size:13px;margin-top:20px">${T.credit}</p></div>
            <div><p class="colh">Wanneer je wilt</p><div class="rows">${free}</div>
              <div class="sub" style="margin-top:18px"><button class="link" data-go="history">${T.myRuns}</button>${lang()}</div></div>

      };
    }
    return {
      html: `<section class="dock" data-inset="bottom">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><h1 style="font-size:40px;margin:0">${T.brand}</h1>${lang()}</div>

      status: "dark",
    };
  }

  if (screen === "history") {
    const h = HISTORY;
    const inner = `
        <div style="display:flex;justify-content:space-between;align-items:baseline"><h2>${T.myRuns}</h2><button class="link" data-go="start">${T.close}</button></div>
        <div class="stats">${h.stats.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>
        <p class="colh" style="margin:6px 0 0">Lastigste stations</p>
        <table class="rtbl"><tbody>${h.hardest.map(([n, c, a]) => `<tr><td>${n}</td><td class="soft">${c}</td><td class="pt">gem. ${a}</td></tr>`).join("")}</tbody></table>
        <p class="colh" style="margin:20px 0 0">Alle ritten</p>
        <table class="rtbl"><tbody>${h.runs.map(([w, k, p]) => `<tr><td class="soft">${w}</td><td>${k}</td><td class="pt">${p}</td></tr>`).join("")}</tbody></table>
        <p class="data">${h.data}</p>
        <div class="data-actions"><button class="link">Exporteer</button><button class="link">Importeer</button><button class="link">Wis alles</button></div>`;
    if (d) return { html: `${tag}<aside class="drawer" data-inset="right">${inner}</aside>`, status: "dark" };
    return { html: `<div class="page">${inner}</div>`, status: "light" };
  }

  if (screen === "einde") {
    if (d) {
      return {
        html: `${tag}<section class="dock" data-inset="bottom" style="grid-template-columns:340px 1fr;padding-top:24px">
            <div>
              <p class="q-lbl">${T.endLabel}</p>
              <p class="big-total">${nf(TOTAL)}</p>
              <p class="soft" style="margin:4px 0 18px">${T.outOf} punten</p>
              <button class="btn" data-go="raden">${T.again}<span>\u2192</span></button>
              <div class="sub"><button class="link">${T.share}</button><button class="link" data-go="history">${T.myRuns}</button></div>
            </div>
            <div>
              <p class="route-h">Jouw rit</p>
              ${stopsHtml({ done: 5, now: -1 }).replace(/<div class="stop done"><i><\/i><span class="n">4<\/span>/, '<div class="stop done miss"><i style="background:#000;box-shadow:inset 0 0 0 4px #fff"></i><span class="n">4</span>').replace('<span class="pt">0</span>', '<span class="pt">opgegeven</span>')}
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:22px;border-top:1px solid #4a4a4a;padding-top:14px">
                <p class="msg">${T.rank}<br><span class="soft">${T.shareNote}</span></p>
                ${histo()}
              </div>
            </div>
          </section>`,
        status: "dark",
      };
    }
    return {
      html: `<section class="dock" data-inset="bottom" style="padding-top:18px">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><p class="q-lbl">${T.endLabel}</p><button class="link" data-go="start">${T.close}</button></div>
          <p class="big-total">${nf(TOTAL)} <span class="soft" style="font-size:17px;font-weight:400;letter-spacing:0">${T.outOf}</span></p>
          <ol class="vroute" style="margin-top:16px">${ROUNDS.map((r, i) => `<li class="${r.found ? "" : "miss"}"><i></i><div><b>${r.name}</b><span>${r.found ? `${r.tries} ${r.tries === 1 ? "poging" : "pogingen"}` : "opgegeven"}</span></div><em>${nf(r.pts)}</em></li>`).join("")}</ol>
          <p class="msg" style="margin:4px 0 14px">${T.rank}</p>
          <div class="actrow"><button class="link">${T.share}</button><button class="btn" data-go="raden">${T.again}<span>\u2192</span></button></div>
        </section>`,
      status: "dark",
    };
  }

  const s = play(screen, device);
  const primary = s.found
    ? `<button class="btn" data-go="einde">${T.next}${arrow(device)}</button>`
    : `<button class="btn" ${s.pending ? 'data-go="mis"' : "disabled"}>${T.confirm}${arrow(device)}</button>`;
  const lowerLeft = s.found ? `<span></span>` : `<button class="link">${s.pending ? T.remove : T.giveUp}</button>`;
  if (d) {
    return {
      html: `${tag}<section class="dock" data-inset="bottom">
          <div>
            <span class="q-lbl">${s.found ? T.foundTitle : T.whereIs}</span>
            <h1 data-name>${station.name}</h1>
            <p class="msg">${s.found ? T.stat : s.msg}${s.delta ? ` <span class="soft">\u2212${nf(s.delta)} punten</span>` : ""}</p>
          </div>

/* ============================================================
   Map
   ============================================================ */
let stylePromise;
function baseStyle() {
  stylePromise ??= fetch("https://tiles.openfreemap.org/styles/positron")
    .then((r) => r.json())
    .then((style) => {
      // Same filtering as src/map/basemap.ts: no labels or icons, no basemap railways.
      style.layers = style.layers.filter((l) => l.type !== "symbol" && !l.id.startsWith("railway"));
      delete style.sprite;
      delete style.glyphs;
      return style;
    })
    .catch(() => ({ version: 8, sources: {}, layers: [{ id: "background", type: "background", paint: { "background-color": "#eef0f2" } }] }));
  return stylePromise.then((s) => structuredClone(s));
}
function railsGeoJSON() {
  const features = [];
  for (const [u, lines] of Object.entries(window.RAILS || {})) {
    for (const flat of lines) {
      const coords = [];
      let x = 0;
      let y = 0;
      for (let i = 0; i < flat.length; i += 2) {
        x += flat[i];
        y += flat[i + 1];
        coords.push([x / 1e4, y / 1e4]);
      }
      features.push({ type: "Feature", properties: { u }, geometry: { type: "LineString", coordinates: coords } });
    }
  }
  return { type: "FeatureCollection", features };
}
const RAILS_GJ = railsGeoJSON();
const EMPTY = { type: "FeatureCollection", features: [] };
const line = (coords) => ({ type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } }] });

const bbox = (pts) => [
  [Math.min(...pts.map((p) => p[0])), Math.min(...pts.map((p) => p[1]))],
  [Math.max(...pts.map((p) => p[0])), Math.max(...pts.map((p) => p[1]))],
];

/** What each screen puts on the map, independent of the option's look. */
function scene(screen, optKey) {
  const st = [station.lng, station.lat];
  const guess = (g, latest, short) => ({ kind: "guess", lnglat: [g.lng, g.lat], label: short ? (g.hit ? "" : String(g.n)) : `${g.n} \u00b7 ${g.d}`, latest });
  switch (screen) {
    case "pin":
      return { bounds: REGION, markers: [guess(G[0], false), { kind: "pending", lnglat: [G[1].lng, G[1].lat] }] };
    case "mis":
      return { bounds: REGION, markers: [guess(G[0], false), guess(G[1], true)] };
    case "gevonden":
      return {
        bounds: bbox([...G.map((g) => [g.lng, g.lat]), st]),
        maxZoom: 12,
        markers: [guess(G[0], false, true), guess(G[1], false, true), guess(G[2], true, true), { kind: "station", lnglat: st, label: station.name }],
        reveal: [[G[2].lng, G[2].lat], st],
      };
    case "einde":
      return {
        bounds: NL,
        markers: ROUNDS.map((r, i) => ({ kind: "stop", lnglat: [r.lng, r.lat], n: i + 1, label: r.name, left: r.name === "Haren" })),
        ride: optKey === "c" ? ROUNDS.map((r) => [r.lng, r.lat]) : null,
      };
    default:
      return { bounds: NL, markers: [] };
  }
}

class Frame {
  constructor(slot, device) {
    this.slot = slot;
    this.device = device;
    this.el = document.createElement("div");
    this.el.className = `frame is-${device}`;
    this.el.innerHTML = `<div class="map"></div><div class="ui"></div>${device === "phone" ? '<div class="sb dark"><span>9:41</span><span class="sig">5G <span class="batt"></span></span></div>' : ""}`;
    slot.appendChild(this.el);
    this.ui = this.el.querySelector(".ui");
    this.markers = [];
    this.ready = window.maplibregl ? this.initMap() : Promise.resolve();
    this.el.addEventListener("click", (e) => {
      const go = e.target.closest("[data-go]");
      if (go && this.onGo) this.onGo(go.dataset.go);
    });
  }
  size() {
    return this.device === "phone" ? { w: 390, h: 844 } : { w: 1280, h: 800 };
  }
  async initMap() {
    const { w, h } = this.size();
    Object.assign(this.el.style, { width: `${w}px`, height: `${h}px` });
    const style = await baseStyle();
    const map = new maplibregl.Map({
      container: this.el.querySelector(".map"),
      style,
      bounds: NL,
      dragRotate: false,
      pitchWithRotate: false,
      touchPitch: false,
      fadeDuration: 0,
      attributionControl: { compact: true, customAttribution: "Spoorlijnen \u00a9 OpenStreetMap \u00b7 Stations: Rijden de Treinen" },
    });
    this.map = map;
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");
    await map.once("load");
    this.el.querySelector(".maplibregl-ctrl-attrib")?.classList.remove("maplibregl-compact-show");
    map.addSource("rails", { type: "geojson", data: RAILS_GJ });
    map.addSource("reveal", { type: "geojson", data: EMPTY });
    map.addSource("ride", { type: "geojson", data: EMPTY });
    map.addLayer({ id: "rails-heritage", type: "line", source: "rails", filter: ["==", ["get", "u"], "t"], paint: { "line-color": "#9a9a9a", "line-width": 1.1, "line-dasharray": [2, 2] } });
    map.addLayer({
      id: "rails",
      type: "line",
      source: "rails",
      filter: ["!=", ["get", "u"], "t"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: {
        "line-color": "#333",
        "line-width": ["interpolate", ["linear"], ["zoom"], 6, ["match", ["get", "u"], "m", 1.4, 0.9], 12, ["match", ["get", "u"], "m", 3, 2]],
      },
    });
    map.addLayer({ id: "reveal-line", type: "line", source: "reveal", paint: { "line-color": "#000", "line-width": 2 } });
    map.addLayer({ id: "ride-line", type: "line", source: "ride", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#0039a6", "line-width": 6 } });
    map.on("click", () => this.onMapClick?.());
  }
  async show(optKey, screen) {
    const opt = OPTIONS[optKey];
    this.el.className = `frame is-${this.device} opt-${optKey}`;
    this.el.dataset.screen = screen;
    const out = opt.render(screen, this.device);
    this.ui.innerHTML = out.html;
    const sb = this.el.querySelector(".sb");
    if (sb) sb.className = `sb ${out.status === "light" ? "light" : "dark"}`;
    const insets = this.measure();
    for (const k of ["t", "r", "b", "l"]) this.el.style.setProperty(`--in-${k}`, `${insets[k] + (this.device === "phone" ? 8 : 12)}px`);
    await this.ready;
    const map = this.map;
    if (!map) return;
    const canvas = map.getCanvas();
    canvas.style.filter = opt.map.filter || "";
    if (map.getLayer("water")) map.setPaintProperty("water", "fill-color", opt.map.water);
    map.setPaintProperty("rails", "line-color", opt.map.rails);
    map.setPaintProperty("rails-heritage", "line-color", opt.map.heritage);
    map.setPaintProperty("reveal-line", "line-color", opt.map.reveal);
    map.setPaintProperty("reveal-line", "line-dasharray", opt.map.revealDash || [1, 0]);
    if (opt.map.ride) map.setPaintProperty("ride-line", "line-color", opt.map.ride);

    const sc = scene(screen, optKey);
    map.getSource("reveal").setData(sc.reveal ? line(sc.reveal) : EMPTY);
    map.getSource("ride").setData(sc.ride ? line(sc.ride) : EMPTY);
    const pad = (this.device === "phone" ? 18 : 36) + (sc.reveal ? 40 : 0);
    const { w, h } = this.size();
    const padding = {
      top: Math.min(insets.t + pad, h * 0.7),
      bottom: Math.min(insets.b + pad, h * 0.7),
      left: Math.min(insets.l + pad, w * 0.8),
      right: Math.min(insets.r + pad, w * 0.8),
    };
    // A sheet that covers the middle of the screen: frame the country in the free area above it.
    if (padding.top + padding.bottom > h - 120) padding.bottom = Math.max(pad, h - padding.top - 160);
    if (padding.left + padding.right > w - 120) padding.right = pad;
    map.resize();
    map.fitBounds(sc.bounds, { padding, maxZoom: sc.maxZoom ?? 11, duration: 0 });
    for (const m of this.markers) m.remove();
    this.markers = [];
    for (const m of sc.markers) {
      const el = document.createElement("div");
      el.className = `mk mk-${m.kind}${m.latest ? " latest" : ""}${m.left ? " left" : ""}`;
      el.innerHTML = m.kind === "stop" ? `<i>${optKey === "c" ? "" : m.n}</i><span>${optKey === "c" ? `${m.n} ` : ""}${m.label}</span>` : `<i></i>${m.label ? `<span>${m.label}</span>` : ""}`;
      this.markers.push(new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat(m.lnglat).addTo(map));
      // The station label hangs to the left when it fits, so it doesn't cover the guesses east of it.
      if (m.kind === "station") el.classList.toggle("left", map.project(m.lnglat).x - el.querySelector("span").offsetWidth - 12 > insets.l);
    }
  }
  /** Free map area: how far UI marked with data-inset reaches in from each edge. */
  measure() {
    const fr = this.el.getBoundingClientRect();
    const scale = fr.width / this.size().w || 1;
    const ins = { t: 0, r: 0, b: 0, l: 0 };
    for (const n of this.ui.querySelectorAll("[data-inset]")) {
      const r = n.getBoundingClientRect();
      const side = n.dataset.inset;
      if (side === "top") ins.t = Math.max(ins.t, (r.bottom - fr.top) / scale);
      if (side === "bottom") ins.b = Math.max(ins.b, (fr.bottom - r.top) / scale);
      if (side === "left") ins.l = Math.max(ins.l, (r.right - fr.left) / scale);
      if (side === "right") ins.r = Math.max(ins.r, (fr.right - r.left) / scale);
    }
    if (this.device === "phone") ins.t = Math.max(ins.t, 47);
    return ins;
  }
}

function readHash() {

  if (["desktop", "phone", "compare"].includes(v)) state.view = v;

function writeHash() {
  history.replaceState(null, "", `#${state.opt}/${state.screen}/${state.view}`);
}

function frameFor(key, device) {
  const id = `${key}:${device}`;
  if (!frames[id]) {
    const slot = document.createElement("div");
    slot.className = `slot ${device}`;
    stage.appendChild(slot);
    const f = new Frame(slot, device);
    f.onGo = (screen) => go({ screen });
    f.onMapClick = () => {
      if (state.screen === "raden" || state.screen === "mis") go({ screen: "pin" });
    };
    frames[id] = f;
  }
  return frames[id];
}

function place(f, x, y, scale, caption) {
  const { w, h } = f.size();
  Object.assign(f.el.style, { width: `${w}px`, height: `${h}px` });
  f.slot.style.display = "";
  f.slot.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  let cap = f.slot.querySelector(".caption");
  if (caption) {
    if (!cap) {
      cap = document.createElement("div");
      cap.className = "caption";
      f.slot.prepend(cap);
    }
    cap.textContent = caption;
  } else cap?.remove();
}

function render() {
  writeHash();
  for (const b of document.querySelectorAll("#opts button")) b.setAttribute("aria-pressed", String(b.dataset.k === state.opt));
  for (const b of document.querySelectorAll("#screens button")) b.setAttribute("aria-pressed", String(b.dataset.k === state.screen));
  for (const b of document.querySelectorAll("#devices button")) b.setAttribute("aria-pressed", String(b.dataset.k === state.view));
  renderNotes();

  const W = stage.clientWidth;
  const H = stage.clientHeight;
  const used = new Set();
  if (state.view === "compare") {
    const keys = Object.keys(OPTIONS);
    const device = "phone";
    const bez = 22;
    const fw = 390 + bez;
    const fh = 844 + bez;
    const gap = 40;
    const scale = Math.min((W - gap * 5) / (fw * 4), (H - 90) / fh, 1);
    const total = fw * 4 * scale + gap * 3;
    keys.forEach((k, i) => {
      const f = frameFor(k, device);
      used.add(f);
      place(f, (W - total) / 2 + i * (fw * scale + gap), 60, scale, `${OPTIONS[k].letter} \u00b7 ${OPTIONS[k].name}`);
      f.show(k, state.screen);
    });
  } else {
    const device = state.view;
    const f = frameFor("main", device);
    used.add(f);
    const bez = device === "phone" ? 22 : 0;
    const { w, h } = f.size();
    const scale = Math.min((W - 40) / (w + bez), (H - 40) / (h + bez), 1);
    place(f, (W - (w + bez) * scale) / 2, (H - (h + bez) * scale) / 2, scale);
    f.show(state.opt, state.screen);
  }
  for (const f of Object.values(frames)) if (!used.has(f)) f.slot.style.display = "none";
}

function go(patch) {
  Object.assign(state, patch);
  render();
}

function renderNotes() {
  const el = document.getElementById("notes");
  el.classList.toggle("hidden", !state.notes);
  const o = OPTIONS[state.opt];
  el.innerHTML = `
    <section>
      <p class="kicker">${o.kicker}${state.view === "compare" ? " (compare shows all four, notes follow the Option buttons)" : ""}</p>
      <h2>${o.name}</h2>
      <p class="lead">${o.lead}</p>
      <h3>Why</h3><ul>${o.why.map((x) => `<li>${x}</li>`).join("")}</ul>
      <h3>What it costs</h3><ul>${o.costs.map((x) => `<li>${x}</li>`).join("")}</ul>
      <h3>App icon</h3><div class="icon">${o.icon}<p>${o.iconNote}</p></div>
    </section>
    <section>
      <h3 style="margin-top:0">In every option</h3>
      <ul>
        <li>No yellow. Blue, white and black, with grey only for secondary text and empty states.</li>
        <li>Square corners on every panel, button and label. The only round shapes are map markers.</li>
        <li>No shadows, blur or gradients. Panels are separated by colour or a black rule.</li>
        <li>One typeface, Helvetica, in regular and bold. Big steps between sizes, so the station name and the score stand out without boxes around them.</li>
        <li>Numbers use tabular figures, so they don't shift as the score counts down.</li>
        <li>Text buttons are underlined. Filled buttons are for the one thing to do next.</li>
        <li>No emoji in the interface. The share text keeps its coloured squares because it's meant for chat apps.</li>
        <li>Copy says "Klik" on a computer and "Tik" on a phone.</li>
      </ul>
    </section>
    <section>
      <h3 style="margin-top:0">Copy changes</h3>
      <table>
        <thead><tr><th>Now</th><th>Proposed</th></tr></thead>
        <tbody>
          <tr><td>Rondescore 5.000</td><td>Nog te halen 5.000<small>The number starts at 5.000 and only goes down. "Score" reads as points you've already earned.</small></td></tr>
          <tr><td>Five unlabelled bars</td><td>Station 3 van 5<small>B and C also show each finished station's points.</small></td></tr>
          <tr><td>Goed zo? Bevestig je gok.</td><td>Pin staat. Klik op Gok hier, of klik ergens anders om hem te verplaatsen.<small>"Goed zo" means "well done". The new line says what you can do next.</small></td></tr>
          <tr><td>31 km ernaast \u00b7 warmer</td><td>6,1 km ernaast. Dichterbij dan je vorige gok. \u2212296 punten<small>Says what "warmer" meant and what the miss cost.</small></td></tr>
          <tr><td>Logo is a hidden home button</td><td>A visible "Menu" button<small>It goes to the start screen. The run stays saved.</small></td></tr>
          <tr><td>"Mijn ritten" next to Opgeven during a round</td><td>Only on the start and results screens<small>You don't need it mid-round, and it competed with Opgeven.</small></td></tr>
          <tr><td>Opgeven, with the cost in a tooltip</td><td>Opgeven, "levert 0 punten op" next to it where there's room<small>Tooltips don't exist on a phone.</small></td></tr>
          <tr><td>Dagelijkse rit \u00b7 nieuw, Vrij spelen, and a Stations toggle under both</td><td>Two blocks, each with its own start button. The station choice sits inside Vrij spelen.<small>The toggle only ever affected free play.</small></td></tr>
          <tr><td>Dagelijkse rit</td><td>Rit van vandaag, and "Rit van 28 september" afterwards<small>Says which day's ride it is.</small></td></tr>
          <tr><td>One-sentence tagline</td><td>"Raad waar Nederlandse treinstations liggen." plus three numbered rules</td></tr>
          <tr><td>Nog een rit (after the daily ride)</td><td>Vrij spelen<small>That button starts a free run, so the label says so.</small></td></tr>
          <tr><td>Deel resultaat</td><td>Deel uitslag, with "Kopieert je score en pogingen, zonder stationsnamen."<small>People can see it won't spoil the stations for friends.</small></td></tr>
          <tr><td>Emoji squares in the results table</td><td>Points as a number and a thin bar, with column headings</td></tr>
          <tr><td>Helaas, 0 punten</td><td>Opgegeven. 0 punten.</td></tr>
          <tr><td>Dagelijkse reeks</td><td>Dagen op rij</td></tr>
          <tr><td>Storage note: quota in MB, "gemarkeerd als blijvend"</td><td>One sentence: how many runs, how big, and to export now and then</td></tr>
        </tbody>
      </table>
    </section>
    <section>
      <h3 style="margin-top:0">Using this page</h3>
      <p><kbd>1</kbd>\u2013<kbd>4</kbd> option, <kbd>\u2190</kbd> <kbd>\u2192</kbd> screen, <kbd>P</kbd> phone or desktop, <kbd>C</kbd> compare, <kbd>N</kbd> notes. Buttons in the mockups work too: click the map on "Guess" to place a pin. The URL keeps your place, so you can send a link to a specific screen.</p>
      <p style="margin-top:8px;color:#666">Demo run: Rit van vandaag on 28 September. Scores and distances come from the game's own scoring code. Everything else (players, percentages, history) is made up.</p>
    </section>`;
}

function buildBar() {
  const opts = document.getElementById("opts");
  for (const [k, o] of Object.entries(OPTIONS)) {
    const b = document.createElement("button");
    b.className = "opt";
    b.dataset.k = k;
    b.innerHTML = `<b>${o.letter}</b>${o.name}`;
    b.onclick = () => go({ opt: k });
    opts.appendChild(b);
  }
  const screens = document.getElementById("screens");
  for (const [k, label] of SCREENS) {
    const b = document.createElement("button");
    b.dataset.k = k;
    b.textContent = label;
    b.onclick = () => go({ screen: k });
    screens.appendChild(b);
  }
  const devices = document.getElementById("devices");
  for (const [k, label] of [["desktop", "Desktop"], ["phone", "Phone"], ["compare", "Compare"]]) {
    const b = document.createElement("button");
    b.dataset.k = k;
    b.textContent = label;
    b.onclick = () => go({ view: k });
    devices.appendChild(b);
  }
  document.getElementById("toggle-notes").onclick = (e) => {
    state.notes = !state.notes;
    e.currentTarget.setAttribute("aria-pressed", String(state.notes));
    render();
  };
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const keys = Object.keys(OPTIONS);
  const i = SCREENS.findIndex(([k]) => k === state.screen);
  if (/^[1-4]$/.test(e.key)) go({ opt: keys[Number(e.key) - 1] });
  else if (e.key === "ArrowRight") go({ screen: SCREENS[(i + 1) % SCREENS.length][0] });
  else if (e.key === "ArrowLeft") go({ screen: SCREENS[(i - 1 + SCREENS.length) % SCREENS.length][0] });
  else if (e.key === "p" || e.key === "P") go({ view: state.view === "phone" ? "desktop" : "phone" });
  else if (e.key === "c" || e.key === "C") go({ view: state.view === "compare" ? "desktop" : "compare" });
  else if (e.key === "n" || e.key === "N") document.getElementById("toggle-notes").click();
});
let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 80);
});

readHash();
buildBar();
render();
</script>
